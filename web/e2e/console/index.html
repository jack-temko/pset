<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PSet console</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font: 13px/1.5 system-ui, sans-serif; background: #14161a; color: #d8dce4; height: 100vh; display: flex; }
aside { width: 310px; flex-shrink: 0; background: #1a1d23; border-right: 1px solid #2a2e36; overflow-y: auto; padding: 14px; }
h1 { font-size: 15px; margin: 0 0 4px; color: #fff; }
.hint { color: #8a93a3; font-size: 11px; margin-bottom: 10px; }
h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: #8a93a3; margin: 16px 0 6px; }
.row { padding: 7px 8px; border-radius: 6px; margin-bottom: 2px; }
.row:hover { background: #22262e; }
.row.sel { background: #2a3040; }
.row .line1 { display: flex; align-items: center; gap: 6px; }
.badge { font-size: 10px; padding: 1px 7px; border-radius: 99px; font-family: ui-monospace, monospace; flex-shrink: 0; }
.badge.flow { background: #3a2f4d; color: #c9a7f0; }
.badge.state { background: #243629; color: #8fd0a0; }
.row .title { flex: 1; }
.row .btns { display: flex; gap: 6px; margin-top: 5px; }
.row .note { color: #8a93a3; font-size: 11px; margin-top: 3px; display: none; }
.row:hover .note, .row.sel .note { display: block; }
button { font: 12px system-ui; background: #2a2f39; color: #d8dce4; border: 1px solid #3a4048; border-radius: 5px; padding: 3px 10px; cursor: pointer; }
button:hover { background: #343b47; }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: #2c4a6e; border-color: #3d628f; }
.thumbs { display: flex; gap: 6px; margin-top: 7px; flex-wrap: wrap; }
.thumbs img { height: 56px; border: 1px solid #3a4048; border-radius: 4px; cursor: pointer; }
.thumbs img:hover { border-color: #7cb8e8; }
main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#top { padding: 10px 14px; border-bottom: 1px solid #2a2e36; background: #1a1d23; display: flex; flex-direction: column; gap: 8px; }
.trow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.trow .label { color: #8a93a3; font-size: 11px; }
.chip { background: #232830; border-radius: 99px; padding: 2px 10px; font-size: 11px; font-family: ui-monospace, monospace; }
.chip button { background: none; border: 0; color: #8a93a3; padding: 0 0 0 6px; font-size: 11px; cursor: pointer; }
.spacer { flex: 1; }
select, input { font: 12px system-ui; background: #22262e; color: #d8dce4; border: 1px solid #3a4048; border-radius: 5px; padding: 3px 6px; }
input { width: 110px; font-family: ui-monospace, monospace; }
input.tiny { width: 58px; }
.hidden { display: none !important; }
#status { font-size: 12px; color: #9aa3b2; min-height: 18px; }
#status a { color: #7cb8e8; }
#status.err { color: #ff9d9d; }
iframe { flex: 1; border: 0; width: 100%; background: #fff; }
#runpane { display: none; height: 150px; overflow-y: auto; background: #101216; color: #9fb58a; font: 11px/1.5 ui-monospace, monospace; padding: 8px 12px; margin: 0; border-top: 1px solid #2a2e36; white-space: pre-wrap; }
#lightbox { position: fixed; inset: 0; background: rgba(8,10,13,.9); display: none; z-index: 99; }
#lightbox.on { display: block; }
#lightbox img { max-width: 94vw; max-height: 84vh; display: block; margin: 4vh auto 0; border-radius: 6px; }
#lightbox .bar { text-align: center; color: #cfd5df; padding: 10px; font-family: ui-monospace, monospace; font-size: 12px; }
#lightbox .bar button { margin: 0 4px; }
</style>
</head>
<body>
<aside>
  <h1>PSet console</h1>
  <div class="hint">Load stages the situation into the iframe. Flows replay headless-plus-HUD in a separate window; states capture PNGs here.</div>
  <div id="situations"></div>
</aside>
<main>
  <div id="top">
    <div class="trow">
      <span class="label">staged</span>
      <span id="staged" class="chips"><span class="chip">nothing yet</span></span>
      <span class="spacer"></span>
      <span class="label">viewport</span>
      <select id="viewport">
        <option>1440x900</option>
        <option>1280x800</option>
        <option>1920x1080</option>
        <option value="custom">custom…</option>
      </select>
      <input id="vw" class="tiny hidden" type="number" placeholder="w" value="1536">
      <input id="vh" class="tiny hidden" type="number" placeholder="h" value="960">
      <span class="label">replay theme</span>
      <select id="rtheme">
        <option value="both">both</option>
        <option value="light">light</option>
        <option value="dark">dark</option>
      </select>
      <button id="rebuild">Rebuild dist</button>
    </div>
    <div class="trow">
      <span class="label">network</span>
      <select id="rkind">
        <option value="slow">slow</option>
        <option value="error">error</option>
        <option value="offline">offline</option>
        <option value="hang">hang</option>
        <option value="killsse">kill SSE</option>
      </select>
      <input id="rpattern" placeholder="regex, e.g. ^/api/books" value="^/api/books">
      <input id="rdelay" class="tiny hidden" type="number" placeholder="ms" value="2000">
      <input id="rstatus" class="tiny hidden" type="number" placeholder="500" value="500">
      <button id="addrule">Add rule</button>
      <span id="rulechips"></span>
    </div>
    <div class="trow">
      <span id="status">loading…</span>
      <span class="spacer"></span>
      <span id="runstatus"></span>
    </div>
  </div>
  <iframe id="app" src="/"></iframe>
  <pre id="runpane"></pre>
</main>
<div id="lightbox">
  <img id="lbimg" alt="">
  <div class="bar">
    <button id="lbprev">←</button>
    <span id="lbcap"></span>
    <button id="lbnext">→</button>
    <button id="lbclose">close</button>
  </div>
</div>
<script src="/__control/app.js"></script>
</body>
</html>
