# Go wire types -> TypeScript. Run with `make gen`; never edit the output.
packages:
  - path: github.com/jackt/pset/internal/httpx
    include_files: [wire.go]
    enum_style: union
    output_path: web/src/api/gen/httpx.ts
    frontmatter: "// Generated from internal/httpx/wire.go by tygo. Do not edit."
  - path: github.com/jackt/pset/internal/settings
    include_files: [wire.go]
    enum_style: union
    output_path: web/src/api/gen/settings.ts
    frontmatter: "// Generated from internal/settings/wire.go by tygo. Do not edit."
  - path: github.com/jackt/pset/internal/library
    include_files: [wire.go]
    enum_style: union
    output_path: web/src/api/gen/library.ts
    frontmatter: "// Generated from internal/library/wire.go by tygo. Do not edit."
