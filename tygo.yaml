  - path: github.com/jackt/pset/internal/library
    include_files: [wire.go]
    enum_style: union
    output_path: web/src/api/gen/library.ts
    type_mappings:
      pagenum.Run: 'Run'
      probnum.Style: 'Style'
      probnum.Form: 'Form'
      probnum.Where: 'Where'
      errs.View: 'View'
    frontmatter: |
      // Generated from internal/library/wire.go by tygo. Do not edit.
      import type { View } from './errs'
      import type { Run } from './pagenum'
      import type { Form, Style, Where } from './probnum'

  - path: github.com/jackt/pset/internal/doc
    include_files: [wire.go]
    enum_style: union
    output_path: web/src/api/gen/doc.ts
    frontmatter: |
      // Generated from internal/doc/wire.go by tygo. Do not edit.
      /** One plotted point, [x, y]. */
      export type Point = [number, number]
      /** One block of a document: the JSON of one of the block types below. */
      export type Block = HintBlock | PartBlock | StepBlock | ParaBlock | NoteBlock | MathBlock | DerivationBlock | CalloutBlock | StatementBlock | TableBlock | PlotBlock | CodeBlock | AnswerBlock | RawBlock
