# Go wire types -> TypeScript. Run with `make gen`; never edit the output.
packages:
  - path: github.com/jackt/pset/internal/errs
    include_files: [wire.go]
    enum_style: union
    output_path: web/src/api/gen/errs.ts
    frontmatter: '// Generated from internal/errs/wire.go by tygo. Do not edit.'
  - path: github.com/jackt/pset/internal/errlog
    include_files: [wire.go]
    enum_style: union
    output_path: web/src/api/gen/errlog.ts
    frontmatter: '// Generated from internal/errlog/wire.go by tygo. Do not edit.'
  - path: github.com/jackt/pset/internal/settings
    include_files: [wire.go]
    enum_style: union
    output_path: web/src/api/gen/settings.ts
    frontmatter: '// Generated from internal/settings/wire.go by tygo. Do not edit.'
  - path: github.com/jackt/pset/internal/pagenum
    include_files: [wire.go]
    enum_style: union
    output_path: web/src/api/gen/pagenum.ts
    frontmatter: '// Generated from internal/pagenum/wire.go by tygo. Do not edit.'
  - path: github.com/jackt/pset/internal/probnum
