# Go wire types -> TypeScript. Run with `make gen`; never edit the output.
packages:
  - path: github.com/jackt/pset/internal/httpx
    include_files: [wire.go]
    enum_style: union
    output_path: web/src/api/gen/httpx.ts
    frontmatter: "// Generated from internal/httpx/wire.go by tygo. Do not edit."
  - path: github.com/jackt/pset/internal/settings
    include_files: [wire.go]
    enum_style: union
    output_path: web/src/api/gen/settings.ts
    frontmatter: "// Generated from internal/settings/wire.go by tygo. Do not edit."
  - path: github.com/jackt/pset/internal/pagenum
    include_files: [wire.go]
    enum_style: union
    output_path: web/src/api/gen/pagenum.ts
    frontmatter: "// Generated from internal/pagenum/wire.go by tygo. Do not edit."
  - path: github.com/jackt/pset/internal/library
    include_files: [wire.go]
    enum_style: union
    output_path: web/src/api/gen/library.ts
    type_mappings:
      pagenum.Run: "Run"
    frontmatter: |
      // Generated from internal/library/wire.go by tygo. Do not edit.
      import type { Run } from './pagenum'

  - path: github.com/jackt/pset/internal/cards
    include_files: [wire.go]
    enum_style: union
    output_path: web/src/api/gen/cards.ts
    frontmatter: |
      // Generated from internal/cards/wire.go by tygo. Do not edit.
      /** One plotted point, [x, y]. */
      export type Point = [number, number]
  - path: github.com/jackt/pset/internal/homework
    include_files: [wire.go]
    enum_style: union
    output_path: web/src/api/gen/homework.ts
    type_mappings:
      cards.Segment: "Segment"
    frontmatter: |
      // Generated from internal/homework/wire.go by tygo. Do not edit.
      import type { Segment } from './cards'
  - path: github.com/jackt/pset/internal/ask
    include_files: [wire.go]
    enum_style: union
    output_path: web/src/api/gen/ask.ts
    type_mappings:
      cards.Segment: "Segment"
      cards.Kind: "Kind"
    frontmatter: |
      // Generated from internal/ask/wire.go by tygo. Do not edit.
      import type { Kind, Segment } from './cards'
  - path: github.com/jackt/pset/internal/memory
    include_files: [wire.go]
    enum_style: union
    output_path: web/src/api/gen/memory.ts
    frontmatter: "// Generated from internal/memory/wire.go by tygo. Do not edit."
  - path: github.com/jackt/pset/internal/activity
    include_files: [wire.go]
    enum_style: union
    output_path: web/src/api/gen/activity.ts
    frontmatter: "// Generated from internal/activity/wire.go by tygo. Do not edit."
