name: CI

# Every change lands on dev by pull request (the design work lands on the
# long-lived `design` branch, temporary, see AGENTS.md), and the ruleset
# needs `check` green. A pull request into main (a release) or a push to it
# also runs the bundle build and the vulnerability scan. Spec:
# ideas/git-workflow-grill.md.
on:
  push:
    branches: [dev, main, design]
  pull_request:
    branches: [dev, main, design]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # All history, so the jump guard can diff a pull request against its base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The PDF tests skip without these, and a skipped test checks nothing.
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr
      - run: npm ci
        working-directory: web
      - run: make check

      # The loading proof (make loading-check, ideas/skeleton-grill.md S6):
      # only for a change under web/. It runs on the design page's sample
      # data, so it needs no server, secret or model.
      - name: Does this change touch the web app?
        id: web
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="origin/${{ github.base_ref }}...HEAD"
          else
            range="${{ github.event.before }}...HEAD"
          fi
          if ! git diff --name-only "$range" >/dev/null 2>&1; then
            # No usable range (a new branch's first push): run it.
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$range" | grep -Eq '^(web/|tools/loading-check\.sh)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Playwright version
        if: steps.web.outputs.changed == 'true'
        id: pw
        working-directory: web
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: steps.web.outputs.changed == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        if: steps.web.outputs.changed == 'true'
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: The loading proof
        if: steps.web.outputs.changed == 'true'
        run: make loading-check

      # The jump guard (make jumps-check) is off for now (2026-11-04, AGENTS.md):
      # it comes back screen by screen as screens are wired (skeleton-grill S6).

  # What friends run: the shipped web bundle and the server, built. Only for
  # a release.
  release-build:
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: make build

  # The standard library and every module PSet calls, against the Go
  # vulnerability database. Only for a release.
  vulnerabilities:
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
