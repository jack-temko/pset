version: '2'

linters:
  default: standard
  enable:
    - revive
    - misspell
    - nolintlint
    - wrapcheck
    - errorlint
  settings:
    staticcheck:
      checks: ['all']
    revive:
      # Go Code Review Comments.
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id
    nolintlint:
      require-explanation: true
      require-specific: true
    wrapcheck:
      # An error from another package is wrapped in a catalog entry before it
      # leaves a function; PSet's own packages already return errors that
      # carry one, or are wrapped where they are raised.
      ignore-package-globs:
        - github.com/jackt/pset/*
      ignore-sigs:
        - .New(
        - .Wrap(
        - .Of(
        - .OnField(
        - .About(
        - errors.New(
        - errors.Join(
        - fmt.Errorf(
    errorlint:
      errorf: true
      asserts: true
      comparison: true

  exclusions:
    rules:
      - path: _test\.go
        linters: [wrapcheck]
      - path: ^tools/
        linters: [wrapcheck]

issues:
  # Every finding, not the first fifty: a lint that hides some is not a lint.
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/jackt/pset
